<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description"
    content="FirePulse - Modern Financial Independence Calculator. Plan your FIRE journey with interactive projections, multi-currency support, and intelligent Monte Carlo simulations.">
  <meta name="keywords"
    content="FIRE calculator, financial independence, retire early, net worth tracker, retirement planning">
  <meta name="author" content="FirePulse">
  <meta property="og:title" content="FirePulse | Financial Independence Calculator">
  <meta property="og:description"
    content="Plan your path to financial independence with FirePulse. Interactive projections, smart simulations, and beautiful visualizations.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">

  <title>FirePulse | Financial Independence Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Modern CSS Custom Properties */
    :root {
      font-size: 16px;

      /* Color Palette - Light Mode */
      --fp-bg-primary: #f8fafc;
      --fp-bg-secondary: #ffffff;
      --fp-bg-tertiary: #f1f5f9;
      --fp-bg-card: rgba(255, 255, 255, 0.85);

      --fp-text-primary: #0f172a;
      --fp-text-secondary: #475569;
      --fp-text-muted: #94a3b8;
      --fp-text-accent: #6366f1;

      --fp-brand-primary: #6366f1;
      --fp-brand-secondary: #8b5cf6;

      --fp-border-light: rgba(0, 0, 0, 0.06);
      --fp-shadow-soft: 0 2px 8px -2px rgba(0, 0, 0, 0.06), 0 4px 16px -4px rgba(0, 0, 0, 0.06);
      --fp-shadow-medium: 0 4px 12px -2px rgba(0, 0, 0, 0.1), 0 8px 24px -4px rgba(0, 0, 0, 0.08);
      --fp-shadow-large: 0 8px 30px rgba(0, 0, 0, 0.12);

      /* Timing */
      --fp-transition: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Mode */
    [data-theme="dark"] {
      --fp-bg-primary: #0f172a;
      --fp-bg-secondary: #1e293b;
      --fp-bg-tertiary: #334155;
      --fp-bg-card: rgba(30, 41, 59, 0.9);

      --fp-text-primary: #f8fafc;
      --fp-text-secondary: #cbd5e1;
      --fp-text-muted: #64748b;
      --fp-text-accent: #818cf8;

      --fp-border-light: rgba(255, 255, 255, 0.08);
      --fp-shadow-soft: 0 2px 8px -2px rgba(0, 0, 0, 0.4);
      --fp-shadow-medium: 0 4px 12px -2px rgba(0, 0, 0, 0.5);
      --fp-shadow-large: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    /* Mobile-specific improvements */
    @media (max-width: 640px) {
      :root {
        font-size: 15px;
      }

      /* Better touch targets */
      button,
      input,
      select {
        min-height: 44px;
      }

      /* Improved slider touch handling */
      input[type="range"] {
        height: 44px;
        margin: 10px 0;
      }

      /* Better spacing for mobile */
      .space-y-8> :not([hidden])~ :not([hidden]) {
        margin-top: 1rem;
      }

      .space-y-6> :not([hidden])~ :not([hidden]) {
        margin-top: 0.75rem;
      }

      /* Mobile-friendly hover states */
      button:hover {
        transform: scale(1.02);
      }

      /* Better mobile scrolling */
      .overflow-y-auto {
        -webkit-overflow-scrolling: touch;
      }

      /* Mobile table improvements */
      .custom-scrollbar {
        scroll-snap-type: x mandatory;
      }

      .custom-scrollbar>* {
        scroll-snap-align: start;
      }
    }

    /* Tablet improvements */
    @media (min-width: 641px) and (max-width: 1024px) {
      :root {
        font-size: 15px;
      }
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: var(--fp-bg-primary);
      color: var(--fp-text-primary);
      transition: background-color var(--fp-transition), color var(--fp-transition);
    }

    /* Headings font */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Outfit', 'Inter', sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom layout fixes */
    .slider-input-container {
      min-width: 0;
    }

    .slider-input-value {
      min-width: 0;
      flex-shrink: 0;
    }

    .slider-input-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Grid layout improvements */
    .input-grid {
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .input-grid {
        gap: 1.5rem;
      }
    }

    /* Prevent overlapping */
    .space-y-8> :not([hidden])~ :not([hidden]) {
      margin-top: 2rem;
    }

    .space-y-10> :not([hidden])~ :not([hidden]) {
      margin-top: 2.5rem;
    }

    @media (min-width: 768px) {
      .space-y-8> :not([hidden])~ :not([hidden]) {
        margin-top: 2rem;
      }

      .space-y-10> :not([hidden])~ :not([hidden]) {
        margin-top: 2.5rem;
      }
    }

    /* Hide number input spinners for a cleaner UI as requested */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* Mobile-friendly scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #cbd5e1, #94a3b8);
      border-radius: 10px;
      border: 2px solid #f1f5f9;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #94a3b8, #64748b);
    }

    /* Mobile scrollbar improvements */
    @media (max-width: 640px) {
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-thumb {
        border: 1px solid #f1f5f9;
      }
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f8fafc;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: linear-gradient(to right, #cbd5e1, #94a3b8);
      border-radius: 10px;
      border: 1px solid #f8fafc;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to right, #94a3b8, #64748b);
    }

    /* Clean slider styling */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-runnable-track {
      background: transparent;
      height: 6px;
      border-radius: 3px;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 0;
      height: 0;
      background: transparent;
      border: none;
    }

    input[type=range]::-moz-range-track {
      background: transparent;
      height: 6px;
      border-radius: 3px;
    }

    input[type=range]::-moz-range-thumb {
      width: 0;
      height: 0;
      background: transparent;
      border: none;
    }

    /* Remove focus outlines on sliders */
    input[type=range]:focus {
      outline: none;
    }

    /* Print Styles - Colorful & Detailed */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0.75cm;
      }

      /* Force print color adjustment - Allow colors! */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }

      /* Reset body for print */
      body {
        background: white !important;
        color: #0f172a !important;
        font-size: 11px !important;
        line-height: 1.5 !important;
        font-family: 'Inter', sans-serif !important;
        margin: 0 !important;
        padding: 10px !important;
        width: 100% !important;
        overflow: visible !important;
        height: auto !important;
      }

      /* Hide screen-specific elements */
      header,
      button,
      input,
      select,
      .hover\:bg-white\/40,
      .hover\:shadow-md,
      .transition-all,
      .backdrop-blur-sm,
      .backdrop-blur-md,
      .backdrop-blur-xl,
      .print\:hidden {
        display: none !important;
      }

      /* Show print content with proper styling */
      .print-title,
      .print-section,
      .print-footer,
      .print-container,
      .print-container * {
        display: block !important;
        visibility: visible !important;
        overflow: visible !important;
        height: auto !important;
      }

      /* Preserve background colors and gradients */
      .print-section,
      .print-section div,
      .print-section span,
      .print-section strong {
        background: inherit !important;
        color: inherit !important;
      }

      /* Allow inline styles to override */
      .print-section[style],
      .print-section div[style],
      .print-section span[style],
      .print-section strong[style] {
        background: unset;
        color: unset;
      }

      /* Print title styling */
      .print-title {
        font-size: 18px !important;
        font-weight: bold !important;
        margin: 0 0 16px 0 !important;
        padding: 12px 0 !important;
        page-break-after: avoid;
      }

      /* Print section styling - Allow colors */
      .print-section {
        margin: 12px 0 !important;
        padding: 14px !important;
        page-break-inside: avoid !important;
      }

      .print-section h3 {
        font-size: 13px !important;
        font-weight: bold !important;
        margin: 0 0 10px 0 !important;
        padding-bottom: 6px !important;
        page-break-after: avoid;
      }

      /* Print footer styling */
      .print-footer {
        margin-top: 20px !important;
        padding: 14px !important;
        page-break-before: avoid;
      }

      /* Remove all overflow and positioning constraints */
      .overflow-y-auto,
      .overflow-hidden,
      .flex-1 {
        overflow: visible !important;
        height: auto !important;
        max-height: none !important;
        flex: none !important;
      }

      /* Remove fixed positioning and constraints */
      .h-screen,
      .sticky,
      .fixed {
        position: static !important;
        height: auto !important;
      }

      /* Remove padding and margin constraints */
      .px-6,
      .md\:px-10,
      .lg\:px-16,
      .pb-6,
      .md\:pb-10,
      .lg\:pb-16,
      .pt-0 {
        padding: 0 !important;
        margin: 0 !important;
      }

      /* Remove max-width constraints */
      .max-w-7xl,
      .max-w-\[1600px\] {
        max-width: none !important;
        width: 100% !important;
      }

      /* Remove space-y utilities that add unwanted margins */
      .space-y-10> :not([hidden])~ :not([hidden]),
      .md\:space-y-14> :not([hidden])~ :not([hidden]),
      .space-y-12> :not([hidden])~ :not([hidden]),
      .md\:space-y-16> :not([hidden])~ :not([hidden]),
      .space-y-8> :not([hidden])~ :not([hidden]),
      .md\:space-y-10> :not([hidden])~ :not([hidden]),
      .space-y-6> :not([hidden])~ :not([hidden]),
      .md\:space-y-8> :not([hidden])~ :not([hidden]) {
        margin-top: 8px !important;
      }

      /* Ensure content flows naturally */
      .flex-col,
      .grid {
        display: block !important;
      }

      /* Remove any transform or scale effects */
      * {
        transform: none !important;
        scale: 1 !important;
      }

      /* Grid layouts for print - Allow proper display */
      .print-section>div[style*="grid"] {
        display: grid !important;
        visibility: visible !important;
      }

      .print-section>div[style*="grid"]>div {
        display: block !important;
        visibility: visible !important;
      }

      /* Show tables and table elements */
      .print-section table {
        display: table !important;
        width: 100% !important;
        page-break-inside: auto !important;
        margin: 8px 0 !important;
        border-collapse: collapse !important;
      }

      .print-section thead {
        display: table-header-group !important;
      }

      .print-section tbody {
        display: table-row-group !important;
      }

      .print-section tr {
        display: table-row !important;
        page-break-inside: avoid !important;
      }

      .print-section th,
      .print-section td {
        display: table-cell !important;
        overflow: visible !important;
        page-break-inside: auto !important;
        padding: 6px !important;
        border: 1px solid #e2e8f0 !important;
      }

      /* Table styling */
      .print-section table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: 8px !important;
        margin: 8px 0 !important;
        page-break-inside: auto;
      }

      .print-section th,
      .print-section td {
        border: 1px solid #e2e8f0 !important;
        padding: 5px !important;
        text-align: left !important;
        vertical-align: top !important;
      }

      .print-section th {
        font-weight: bold !important;
        font-size: 8px !important;
      }

      /* Text styling - maintain inline colors */
      .print-section div,
      .print-section strong,
      .print-section span {
        visibility: visible !important;
        font-size: inherit !important;
      }

      .print-section strong {
        font-weight: bold !important;
      }

      /* Ensure no page breaks inside important elements */
      .print-title,
      .print-section,
      .print-section h3,
      .print-footer {
        page-break-inside: avoid !important;
      }

      /* Specific print color preservation */
      .print-hero,
      .print-info-box,
      .print-header-gradient {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Emoji display */
      .print-section span:first-child {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif !important;
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
