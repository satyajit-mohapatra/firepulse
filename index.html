<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <meta name="description" content="Privacy-first Financial Independence Calculator">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">

  <title>FirePulse | Financial Independence Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      font-size: 16px;
    }

    @media (max-width: 640px) {
      :root {
        font-size: 14px;
      }
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom layout fixes */
    .slider-input-container {
      min-width: 0;
    }

    .slider-input-value {
      min-width: 0;
      flex-shrink: 0;
    }

    .slider-input-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Grid layout improvements */
    .input-grid {
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .input-grid {
        gap: 1.5rem;
      }
    }

    /* Prevent overlapping */
    .space-y-8> :not([hidden])~ :not([hidden]) {
      margin-top: 2rem;
    }

    .space-y-10> :not([hidden])~ :not([hidden]) {
      margin-top: 2.5rem;
    }

    @media (min-width: 768px) {
      .space-y-8> :not([hidden])~ :not([hidden]) {
        margin-top: 2rem;
      }

      .space-y-10> :not([hidden])~ :not([hidden]) {
        margin-top: 2.5rem;
      }
    }

    /* Hide number input spinners for a cleaner UI as requested */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #cbd5e1, #94a3b8);
      border-radius: 10px;
      border: 2px solid #f1f5f9;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #94a3b8, #64748b);
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f8fafc;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: linear-gradient(to right, #cbd5e1, #94a3b8);
      border-radius: 10px;
      border: 1px solid #f8fafc;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to right, #94a3b8, #64748b);
    }

    input[type=range]::-webkit-slider-runnable-track {
      background: linear-gradient(to right, #e2e8f0, #cbd5e1);
      border-radius: 1rem;
      height: 0.5rem;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }

    input[type=range]::-webkit-slider-thumb {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      border: 3px solid white;
      width: 1.4rem;
      height: 1.4rem;
      margin-top: -0.45rem;
      cursor: pointer;
      border-radius: 999px;
      appearance: none;
      box-shadow: 0 4px 8px -1px rgba(79, 70, 229, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 12px -1px rgba(79, 70, 229, 0.4), 0 4px 8px -1px rgba(0, 0, 0, 0.15);
    }

    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(0.95);
    }

    /* Print Styles - Professional White Background */
    @media print {
      @page {
        size: A4 portrait;
        margin: 1cm;
      }

      /* Force print color adjustment */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Reset body for print */
      body {
        background: white !important;
        color: black !important;
        font-size: 12px !important;
        line-height: 1.4 !important;
        font-family: 'Inter', sans-serif !important;
        margin: 0 !important;
        padding: 15px !important;
        width: 100% !important;
        overflow: visible !important;
        height: auto !important;
      }

      /* Hide screen-specific elements */
      header,
      button,
      input,
      select,
      .hover\:bg-white\/40,
      .hover\:shadow-md,
      .transition-all,
      .backdrop-blur-sm,
      .backdrop-blur-md,
      .backdrop-blur-xl,
      .print\:hidden {
        display: none !important;
      }

      /* Show print content with proper styling */
      .print-title,
      .print-section,
      .print-footer,
      .print-container,
      .print-container * {
        display: block !important;
        visibility: visible !important;
        overflow: visible !important;
        height: auto !important;
        background: white !important;
        color: black !important;
      }

      /* Print title styling */
      .print-title {
        font-size: 20px !important;
        font-weight: bold !important;
        text-align: center !important;
        margin: 0 0 20px 0 !important;
        padding: 10px 0 !important;
        border-bottom: 2px solid black !important;
        color: black !important;
        background: white !important;
      }

      /* Print section styling */
      .print-section {
        margin: 20px 0 !important;
        padding: 15px !important;
        border: 1px solid #333 !important;
        page-break-inside: avoid !important;
        background: white !important;
        color: black !important;
      }

      .print-section h3 {
        font-size: 16px !important;
        font-weight: bold !important;
        color: black !important;
        margin: 0 0 10px 0 !important;
        padding-bottom: 5px !important;
        border-bottom: 1px solid #ccc !important;
        background: white !important;
      }

      /* Print footer styling */
      .print-footer {
        margin-top: 30px !important;
        padding-top: 15px !important;
        border-top: 1px solid #ccc !important;
        text-align: center !important;
        font-size: 10px !important;
        color: #666 !important;
        background: white !important;
      }

      /* Remove all overflow and positioning constraints */
      .overflow-y-auto,
      .overflow-hidden,
      .flex-1 {
        overflow: visible !important;
        height: auto !important;
        max-height: none !important;
        flex: none !important;
      }

      /* Remove fixed positioning and constraints */
      .h-screen,
      .sticky,
      .fixed {
        position: static !important;
        height: auto !important;
      }

      /* Remove padding and margin constraints */
      .px-6,
      .md\:px-10,
      .lg\:px-16,
      .pb-6,
      .md\:pb-10,
      .lg\:pb-16,
      .pt-0 {
        padding: 0 !important;
        margin: 0 !important;
      }

      /* Remove max-width constraints */
      .max-w-7xl,
      .max-w-\[1600px\] {
        max-width: none !important;
        width: 100% !important;
      }

      /* Remove space-y utilities that add unwanted margins */
      .space-y-10 > :not([hidden]) ~ :not([hidden]),
      .md\:space-y-14 > :not([hidden]) ~ :not([hidden]),
      .space-y-12 > :not([hidden]) ~ :not([hidden]),
      .md\:space-y-16 > :not([hidden]) ~ :not([hidden]),
      .space-y-8 > :not([hidden]) ~ :not([hidden]),
      .md\:space-y-10 > :not([hidden]) ~ :not([hidden]),
      .space-y-6 > :not([hidden]) ~ :not([hidden]),
      .md\:space-y-8 > :not([hidden]) ~ :not([hidden]) {
        margin-top: 10px !important;
      }

      /* Ensure content flows naturally */
      .flex-col,
      .grid {
        display: block !important;
      }

      /* Remove any transform or scale effects */
      * {
        transform: none !important;
        scale: 1 !important;
      }

      /* Show tables and table elements */
      .print-section table {
        display: table !important;
        width: 100% !important;
        page-break-inside: auto !important;
        margin: 10px 0 !important;
        border-collapse: collapse !important;
        background: white !important;
        color: black !important;
      }

      .print-section thead {
        display: table-header-group !important;
        background: white !important;
        color: black !important;
      }

      .print-section tbody {
        display: table-row-group !important;
        background: white !important;
        color: black !important;
      }

      .print-section tr {
        display: table-row !important;
        page-break-inside: avoid !important;
        background: white !important;
        color: black !important;
      }

      .print-section th,
      .print-section td {
        display: table-cell !important;
        overflow: visible !important;
        page-break-inside: auto !important;
        padding: 8px !important;
        border: 1px solid #ccc !important;
        background: white !important;
        color: black !important;
      }

      .print-section th {
        font-weight: bold !important;
        text-align: left !important;
        background: #f5f5f5 !important;
        color: black !important;
      }

      /* Grid layouts for print */
      .print-section > div[style*="grid"] {
        display: grid !important;
        visibility: visible !important;
        background: white !important;
        color: black !important;
      }

      .print-section > div[style*="grid"] > div {
        display: block !important;
        visibility: visible !important;
        background: white !important;
        color: black !important;
      }

      /* Strong and emphasis elements */
      .print-section strong {
        font-weight: bold !important;
        color: black !important;
        background: white !important;
      }

      /* Span elements */
      .print-section span {
        color: black !important;
        background: white !important;
      }

      /* Basic styling for print elements */
      .print-title {
        font-size: 18px !important;
        font-weight: bold !important;
        text-align: center !important;
        margin: 1rem 0 !important;
        border-bottom: 2px solid black !important;
        padding-bottom: 0.5rem !important;
        page-break-after: avoid;
        visibility: visible !important;
        display: block !important;
      }

      .print-section {
        margin: 1rem 0 !important;
        padding: 0.5rem !important;
        border: 1px solid #d1d5db !important;
        page-break-inside: avoid;
        visibility: visible !important;
        display: block !important;
        background: white !important;
      }

      .print-section h3 {
        font-size: 14px !important;
        font-weight: bold !important;
        margin: 0.5rem 0 !important;
        border-bottom: 1px solid #d1d5db !important;
        padding-bottom: 0.25rem !important;
        page-break-after: avoid;
        color: black !important;
        visibility: visible !important;
        display: block !important;
      }

      /* Table styling */
      .print-section table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: 8px !important;
        margin: 0.5rem 0 !important;
        page-break-inside: auto;
        visibility: visible !important;
        display: table !important;
      }

      .print-section th,
      .print-section td {
        border: 1px solid #d1d5db !important;
        padding: 0.15rem !important;
        text-align: left !important;
        vertical-align: top !important;
        color: black !important;
        background: white !important;
        visibility: visible !important;
        display: table-cell !important;
      }

      .print-section th {
        background: #f3f4f6 !important;
        font-weight: bold !important;
        font-size: 8px !important;
      }

      .print-section tbody tr:nth-child(even) {
        background: #f9fafb !important;
      }

      /* Text styling */
      .print-section div,
      .print-section strong,
      .print-section span {
        color: black !important;
        visibility: visible !important;
        display: block !important;
        font-size: 9px !important;
      }

      .print-section strong {
        font-weight: bold !important;
      }

      .print-section div[style*="font-size"] {
        display: block !important;
        visibility: visible !important;
      }

      /* Footer */
      .print-footer {
        margin-top: 2rem !important;
        padding-top: 1rem !important;
        border-top: 1px solid #d1d5db !important;
        text-align: center !important;
        font-size: 8px !important;
        color: black !important;
        page-break-before: avoid;
        visibility: visible !important;
        display: block !important;
      }

      /* Ensure no page breaks inside important elements */
      .print-title,
      .print-section,
      .print-section h3,
      .print-footer {
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 selection:bg-indigo-100">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
